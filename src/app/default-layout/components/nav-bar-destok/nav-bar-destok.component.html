<header
  class="hidden lg:flex flex-col bg-paper/90 backdrop-blur-[14px] backdrop-saturate-[1.6] border-b border-rule-soft w-full px-8 pt-3.5 pb-2"
>

  <!-- Fila 1: Brand · Buscador · Catálogo -->
  <div class="flex items-center gap-6 w-full">

    <!-- Brand → home -->
    <a routerLink="/" class="flex items-center gap-3 no-underline shrink-0">
      <div class="w-11 h-11 rounded-xl bg-yellow grid place-items-center overflow-hidden shadow-sm shrink-0">
        <img class="w-full h-full object-cover" [src]="logoUrl || 'assets/images/logo.jpg'" alt="Logo" />
      </div>
      <div class="font-display font-extrabold text-[17px] leading-none tracking-tight text-ink">
        La Casa del
        <em class="not-italic font-hand text-coral text-[22px] font-semibold block leading-none mt-0.5">Pintor</em>
      </div>
    </a>

    <!-- Search -->
    <div
      class="flex-1 flex items-center gap-2.5 px-4 py-2.5 bg-white border border-rule rounded-xl transition-all focus-within:border-ink focus-within:shadow-[0_0_0_3px_rgba(26,28,44,0.08)]"
    >
      <button
        type="button"
        (click)="goSearch()"
        class="bg-transparent border-0 p-1.5 rounded-md cursor-pointer flex items-center text-ink-mute hover:text-ink hover:bg-zinc-100 active:scale-90 transition-all shrink-0"
      >
        <span class="material-symbols-outlined text-[18px] leading-none">search</span>
      </button>
      <input
        class="border-0 outline-none bg-transparent flex-1 font-body text-sm text-ink"
        type="text"
        placeholder="Buscar productos, marcas…"
        [(ngModel)]="searchQuery"
        (keydown)="onSearchKeydown($event)"
      />
      @if (searchQuery) {
        <button
          type="button"
          (click)="clearSearch()"
          class="bg-transparent border-0 p-1.5 rounded-md cursor-pointer flex items-center text-ink-mute hover:text-red-500 hover:bg-red-50 active:scale-90 transition-all shrink-0"
          title="Borrar búsqueda"
        >
          <span class="material-symbols-outlined text-[18px] leading-none">close</span>
        </button>
      }
    </div>

    <!-- Catálogo — CTA primario en fila 1 -->
    <a
      routerLink="/catalogo"
      routerLinkActive="!bg-ink !text-white !border-ink"
      class="shrink-0 px-5 py-2.5 rounded-lg inline-flex items-center gap-2 text-sm font-semibold bg-white border border-rule text-ink-soft no-underline transition-all hover:bg-ink hover:text-white hover:border-ink"
    >
      <span class="material-symbols-outlined text-[18px] leading-none">format_paint</span>
      Catálogo
    </a>

  </div>

  <!-- Fila 2: todos los links centrados -->
  <div class="flex items-center justify-center gap-1 pt-2 pb-0.5">

    <a routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="!bg-ink !text-white !border-ink"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-ink/5 hover:text-ink">
      <span class="material-symbols-outlined text-[16px] leading-none">home</span>
      Inicio
    </a>

    <a routerLink="/videos" routerLinkActive="!bg-ink !text-white !border-ink"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-ink/5 hover:text-ink">
      <span class="material-symbols-outlined text-[16px] leading-none">smart_display</span>
      Videos
    </a>

    <a routerLink="/ayuda/como-pedir" routerLinkActive="!bg-ink !text-white !border-ink"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-ink/5 hover:text-ink">
      <span class="material-symbols-outlined text-[16px] leading-none">quiz</span>
      Cómo pedir
    </a>

    <a routerLink="/ayuda/garantia" routerLinkActive="!bg-ink !text-white !border-ink"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-ink/5 hover:text-ink">
      <span class="material-symbols-outlined text-[16px] leading-none">verified</span>
      Garantía
    </a>

    <a routerLink="/sobre-nosotros" routerLinkActive="!bg-ink !text-white !border-ink"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-ink/5 hover:text-ink">
      <span class="material-symbols-outlined text-[16px] leading-none">storefront</span>
      Nosotros
    </a>

    <a routerLink="/asesor" routerLinkActive="!bg-coral !text-white !border-coral"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-coral/10 hover:text-coral">
      <span class="material-symbols-outlined text-[16px] leading-none">tips_and_updates</span>
      ¿Qué pintura?
    </a>

    <!-- Separador -->
    <div class="w-px h-4 bg-rule mx-1.5 shrink-0"></div>

    <button
      (click)="openRender.emit()"
      title="Simulador"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-yellow text-ink border border-yellow/0 cursor-pointer transition-all hover:brightness-95">
      <span class="material-symbols-outlined text-[16px] leading-none">format_paint</span>
      Simulador
    </button>

    <a routerLink="/auth/login" routerLinkActive="!bg-ink !text-white !border-ink"
      class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft no-underline transition-all hover:bg-ink/5 hover:text-ink">
      <span class="material-symbols-outlined text-[16px] leading-none">manage_accounts</span>
      Admin
    </a>

    <div class="relative">
      <button
        class="px-3.5 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-sm font-medium bg-transparent border border-transparent text-ink-soft cursor-pointer transition-all hover:bg-ink/5 hover:text-ink"
        title="Carrito"
        (click)="openCart.emit()"
      >
        <span class="material-symbols-outlined text-[16px] leading-none">shopping_bag</span>
        Carrito
        @if (cartCount > 0) {
          <span class="bg-yellow text-ink font-mono font-bold text-[11px] min-w-[20px] h-5 rounded-full inline-grid place-items-center px-1.5">
            {{ cartCount }}
          </span>
        }
      </button>
      <app-cart-popover [count]="cartCount" arrowRight="right-5" />
    </div>

  </div>

</header>
