<!-- Full-screen modal -->
<div class="fixed inset-0 z-[200] flex flex-col bg-white">

  <!-- Header bar -->
  <div class="flex items-center justify-between px-4 lg:px-5 py-2.5 lg:py-3 border-b border-gray-200 shrink-0 bg-white">
    <div class="flex items-center gap-2 lg:gap-3 min-w-0">
      <span class="material-symbols-outlined text-[20px] lg:text-[22px] text-gray-500 shrink-0">3d_rotation</span>
      <div class="min-w-0">
        <h2 class="font-semibold text-gray-800 text-[14px] lg:text-[15px] leading-tight truncate">Visualizador de espacios</h2>
        <p class="text-[10px] lg:text-[11px] text-gray-400 hidden sm:block">Selecciona un espacio, haz clic en una superficie y elige el color</p>
      </div>
    </div>
    <button (click)="close.emit()"
      class="w-8 h-8 lg:w-9 lg:h-9 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition-all border-0 bg-transparent cursor-pointer shrink-0"
      title="Cerrar">
      <span class="material-symbols-outlined text-[20px] leading-none">close</span>
    </button>
  </div>

  <!-- Body -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <app-room-svg-canvas
      [views]="views"
      [activeView]="activeView()"
      [activeSurface]="activeSurface()"
      [floor]="floor()" [ceiling]="ceiling()"
      [wallLeft]="wallLeft()" [wallBack]="wallBack()" [wallRight]="wallRight()"
      [fachadaLeft]="fachadaLeft()" [fachadaRight]="fachadaRight()"
      (surfaceClicked)="activeSurface.set($event)"
      (viewChanged)="setView($event)"
    />

    <app-room-color-picker
      [colors]="colors()"
      [activeSurface]="activeSurface()"
      [surfaces]="surfaces"
      [activeSurfaceCfg]="activeSurfaceCfg"
      [loading]="loading()"
      (colorSelected)="selectColor($event)"
      (surfaceSelected)="activeSurface.set($event)"
      (resetClicked)="reset()"
    />

  </div>
</div>
