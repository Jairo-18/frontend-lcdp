<div
  class="shrink-0 lg:flex-1 bg-gradient-to-br from-slate-100 to-gray-200 flex flex-col items-center justify-center p-3 lg:p-6 overflow-hidden gap-2 lg:gap-3 h-[38dvh] lg:h-auto">

  <!-- View selector -->
  <div
    class="flex gap-0.5 lg:gap-1 bg-white/90 backdrop-blur-sm rounded-xl p-0.5 lg:p-1 shadow-md border border-white/60 shrink-0">
    @for (v of views(); track v.key) {
    <button (click)="viewChanged.emit(v.key)"
      class="flex items-center gap-1 lg:gap-1.5 px-2 lg:px-3 py-1 lg:py-1.5 rounded-lg text-[11px] lg:text-[12px] font-medium transition-all cursor-pointer border-0"
      [class.bg-ink]="activeView() === v.key" [class.text-white]="activeView() === v.key"
      [class.text-gray-500]="activeView() !== v.key" [class.bg-transparent]="activeView() !== v.key">
      <span class="material-symbols-outlined text-[14px] lg:text-[15px] leading-none">{{ v.icon }}</span>
      <span class="hidden sm:inline">{{ v.label }}</span>
    </button>
    }
  </div>

  <!-- SVG Canvas -->
  <svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" class="w-full h-full"
    style="max-height: calc(100dvh - 155px); filter: drop-shadow(0 12px 40px rgba(0,0,0,0.22))">

    <defs>
      <linearGradient id="floorLight" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.18" />
        <stop offset="100%" stop-color="black" stop-opacity="0.12" />
      </linearGradient>
      <radialGradient id="ceilingGlow" cx="0.5" cy="0.5" r="0.55">
        <stop offset="0%" stop-color="white" stop-opacity="0.22" />
        <stop offset="100%" stop-color="black" stop-opacity="0.06" />
      </radialGradient>
      <linearGradient id="wallLeftShadow" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0%" stop-color="black" stop-opacity="0.14" />
        <stop offset="60%" stop-color="black" stop-opacity="0.05" />
        <stop offset="100%" stop-color="white" stop-opacity="0.04" />
      </linearGradient>
      <linearGradient id="wallRightShadow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="black" stop-opacity="0.10" />
        <stop offset="60%" stop-color="black" stop-opacity="0.03" />
        <stop offset="100%" stop-color="white" stop-opacity="0.06" />
      </linearGradient>
      <radialGradient id="wallBackVignette" cx="0.5" cy="0.45" r="0.7">
        <stop offset="0%" stop-color="white" stop-opacity="0.08" />
        <stop offset="100%" stop-color="black" stop-opacity="0.08" />
      </radialGradient>
      <linearGradient id="aoFloor" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="black" stop-opacity="0.18" />
        <stop offset="100%" stop-color="black" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="glassReflect" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.50" />
        <stop offset="30%" stop-color="white" stop-opacity="0.12" />
        <stop offset="60%" stop-color="white" stop-opacity="0" />
        <stop offset="100%" stop-color="white" stop-opacity="0.08" />
      </linearGradient>
      <radialGradient id="sunPatch" cx="0.5" cy="0.3" r="0.6">
        <stop offset="0%" stop-color="#FFF3D0" stop-opacity="0.30" />
        <stop offset="50%" stop-color="#FFE8A0" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0" />
      </radialGradient>
      <filter id="lampGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="ambientGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.18)" />
      </filter>
      <linearGradient id="skyGradient" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#5BB8D4" />
        <stop offset="45%" stop-color="#A8D8EE" />
        <stop offset="100%" stop-color="#D8EEF8" />
      </linearGradient>
      <linearGradient id="buildingFacade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.09" />
        <stop offset="100%" stop-color="black" stop-opacity="0.07" />
      </linearGradient>
    </defs>

    <!-- Shared room base template: surfaces + overlays + highlights + edges + baseboard + light + window -->
    <ng-template #roomBase [ngTemplateOutlet]="roomBase" let-sunlight="sunlight" let-window="window">
    </ng-template>

    @switch (activeView()) {
