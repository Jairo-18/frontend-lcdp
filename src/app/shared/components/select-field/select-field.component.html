@if (label) {
  <label [for]="id" class="block text-sm font-medium text-ink mb-1">
    {{ label }}@if (required) {<span class="text-coral"> *</span>}
  </label>
}
<div class="relative">
  <select
    [id]="id"
    [disabled]="isDisabled"
    (change)="onSelect($event)"
    (blur)="onTouched()"
    [class]="selectClasses"
  >
    @if (placeholder) {
      <option value="">{{ placeholder }}</option>
    }
    @for (opt of options; track opt.value) {
      <option [value]="opt.value" [selected]="opt.value == _value()">{{ opt.label }}</option>
    }
  </select>
  <span class="material-symbols-outlined pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 mr-2 text-[18px] leading-none text-ink-mute">
    expand_more
  </span>
</div>
@if (hint && !showError) {
  <p class="text-xs text-ink-mute mt-1">{{ hint }}</p>
}
@if (showError) {
  <p class="text-xs text-coral mt-1">{{ resolvedError }}</p>
}
