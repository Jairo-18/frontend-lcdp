@if (count > 0) {
  <div class="absolute top-full right-0 mt-2.5 z-50 pointer-events-none animate-bounce">
    <div class="absolute -top-1.5 w-3 h-3 bg-white border-l border-t border-rule rotate-45" [ngClass]="arrowRight"></div>
    <div class="bg-white border border-rule rounded-xl shadow-lg px-3.5 py-2.5 whitespace-nowrap flex items-center gap-2">
      <span class="relative flex h-4 w-4 shrink-0">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-coral opacity-60"></span>
        <span class="material-symbols-outlined text-[15px] leading-none text-coral relative">shopping_bag</span>
      </span>
      <p class="text-xs font-semibold text-ink">
        {{ count === 1 ? 'Tienes 1 producto en tu carrito' : 'Tienes ' + count + ' productos en tu carrito' }}
      </p>
    </div>
  </div>
}
