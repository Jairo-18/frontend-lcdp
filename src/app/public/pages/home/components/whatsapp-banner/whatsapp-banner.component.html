<!-- ── DESKTOP: Carlos como fondo absoluto (igual que todos.png en hero) ── -->
<section class="hidden lg:flex relative overflow-hidden min-h-[110dvh] items-center">
  <img src="assets/images/carlos.jpeg" alt="" class="absolute inset-0 w-full h-full object-fill object-top z-0"
    aria-hidden="true" />
  <!-- <div class="absolute inset-0 z-[1] pointer-events-none bg-gradient-to-r from-black/80 via-black/60 to-black/20"></div> -->

</section>

<!-- ── MOBILE: fondo sólido + Carlos como imagen embebida (igual que hero en mobile) ── -->

      ¿Necesitas asesoría para tu proyecto?
    </h2>

      Estamos aquí.
    </p>
    <p class="text-white/70 text-[15px] leading-relaxed max-w-[340px]">
      Mándanos una foto del espacio y te recomendamos cantidad, color y producto. Sin compromiso.
    </p>
  </div>

  <!-- Carlos como imagen normal, igual que todos.png en mobile del hero -->
