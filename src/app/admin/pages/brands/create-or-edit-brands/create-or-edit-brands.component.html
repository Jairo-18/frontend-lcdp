<div class="p-4 sm:p-6 lg:p-8">
  <!-- Header -->
  <div class="flex items-center gap-4 mb-6">
    <button
      type="button"
      (click)="goBack()"
      class="p-1.5 rounded-lg hover:bg-[rgba(26,28,44,0.06)] text-ink-mute transition-colors cursor-pointer border-0 bg-transparent"
    >
      <span class="material-symbols-outlined text-[22px] leading-none"
        >arrow_back</span
      >
    </button>
    <div>
      <h1 class="font-display font-bold text-ink text-2xl">
        {{ _editingId() ? 'Editar marca' : 'Nueva marca' }}
      </h1>
      <p class="text-ink-mute text-sm mt-0.5">Marcas</p>
    </div>
  </div>

  @if (_loading()) {
    <div class="flex items-center justify-center py-20 text-ink-mute gap-3">
      <span
        class="material-symbols-outlined text-[28px] leading-none animate-spin"
        >progress_activity</span
      >
      Cargando...
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-5">
      <div class="bg-white border border-rule rounded-2xl p-6 space-y-5">
        <app-input-field
          formControlName="name"
          label="Nombre"
          placeholder="Pintuco"
          [required]="true"
          [upperCase]="true"
          [control]="form.get('name')"
        />
        <app-input-field
          formControlName="code"
          label="Código (único, sin espacios)"
          placeholder="PINTF"
          [required]="true"
          [mono]="true"
          [control]="form.get('code')"
        />
        <app-image-uploader
          folder="brands"
          [images]="_images()"
          (imagesChange)="onImagesChange($event)"
        />

        <div class="flex items-center justify-between pt-1">
          <div>
            <p class="text-sm font-semibold text-ink">Estado</p>
            <p class="text-xs text-ink-mute">Inactivo = no aparece en el catálogo público</p>
          </div>
          <button type="button"
            (click)="form.get('isActive')!.setValue(!form.get('isActive')!.value); form.markAsDirty()"
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors cursor-pointer border-0 shrink-0"
            [class.bg-green-500]="form.get('isActive')!.value"
            [class.bg-ink-mute]="!form.get('isActive')!.value">
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow"
              [class.translate-x-6]="form.get('isActive')!.value"
              [class.translate-x-1]="!form.get('isActive')!.value">
            </span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3">
        <button
          type="button"
          (click)="goBack()"
          class="px-4 py-2 rounded-xl border border-rule text-sm font-semibold text-ink hover:bg-[rgba(26,28,44,0.04)] transition-colors cursor-pointer bg-white"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="_saving() || form.invalid || form.pristine"
          class="flex items-center gap-2 px-5 py-2 rounded-xl bg-ink text-white text-sm font-semibold hover:bg-black disabled:opacity-50 disabled:cursor-not-allowed transition-colors cursor-pointer border-0"
        >
          @if (_saving()) {
            <span
              class="material-symbols-outlined text-[16px] leading-none animate-spin"
              >progress_activity</span
            >
          } @else {
            <span class="material-symbols-outlined text-[16px] leading-none"
              >save</span
            >
          }
          {{ _editingId() ? 'Guardar cambios' : 'Crear marca' }}
        </button>
      </div>
    </form>
  }
</div>
